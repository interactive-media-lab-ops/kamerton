<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#04100D" />
    <title>КАМЕРТОН</title>
  </head>
  <body>
    <!--
      Вміст #root це запасний текст на випадок, коли застосунок не піднявся.
      React очищає контейнер при монтуванні, тому в робочій збірці цей текст не видно.
      Найчастіший випадок: цей файл відкрили подвійним кліком. Це точка входу для
      дев-сервера, а не продукт: шлях /src/main.jsx існує тільки поки працює vite.
    -->
    <div id="root">
      <p>КАМЕРТОН не запустився.</p>
      <p>
        Якщо відкрито app/index.html, це файл для розробки, він працює тільки під
        командою npm run dev. Готовий застосунок лежить окремо: app/dist/kamerton.html,
        один файл, відкривається подвійним кліком і працює офлайн.
      </p>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
